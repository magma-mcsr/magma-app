# Pushing a tag like v0.2.0 builds the signed update and installer, and creates a
# draft GitHub Release with latest.json. Nothing reaches users until the draft is
# published by hand. Installed apps check the latest published release for updates.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing key. Its public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Magma MCSR ${{ github.ref_name }}
          # The Download section is the same every release; add "What's in this version" by hand.
          releaseBody: |
            ### Download

            - Click `Magma-MCSR-Setup.exe` under Assets below, then run it.
            - Windows only for now (Windows 10 and 11, 64-bit).
            - Windows may show "Windows protected your PC" because the installer is not code-signed yet. Click "More info", then "Run anyway".
            - After that, the app updates itself.

            ### What's in this version

            - TODO
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      # Same installer under a name that never changes, so
      # releases/latest/download/Magma-MCSR-Setup.exe always points at the newest version.
      - name: Upload installer with a stable name
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          installer=$(ls target/release/bundle/nsis/*_x64-setup.exe)
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$installer" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=Magma-MCSR-Setup.exe" \
            > /dev/null
