# Pushing a tag like v0.2.0 builds the signed update and installer, and creates a
# draft GitHub Release with latest.json. Nothing reaches users until the draft is
# published by hand. Installed apps check the latest published release for updates.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Release notes: the same Download section every time, then this version's section
      # of CHANGELOG.md (which the app also shows after updating). No section, no release.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          section=$(awk -v head="## $version" '$0 == head { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$section" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo 'body<<RELEASE_NOTES_END'
            cat <<'DOWNLOAD'
          ### Download

          - Click `Magma-MCSR-Setup.exe` under Assets below, then run it.
          - Windows only for now (Windows 10 and 11, 64-bit).
          - If your browser says the file "isn't commonly downloaded", choose Keep (in Edge: click "...", then Keep).
          - Windows may show "Windows protected your PC" because the installer is not code-signed yet. Click "More info", then "Run anyway".
          - After that, the app updates itself.

          ### What's in this version

          DOWNLOAD
            echo "$section"
            echo 'RELEASE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing key. Its public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Magma MCSR ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      # Same installer under a name that never changes, so
      # releases/latest/download/Magma-MCSR-Setup.exe always points at the newest version.
      - name: Upload installer with a stable name
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          installer=$(ls target/release/bundle/nsis/*_x64-setup.exe)
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$installer" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=Magma-MCSR-Setup.exe" \
            > /dev/null

      # The package for the Microsoft Store, uploaded there by hand. Kept with this workflow run,
      # not in the release: it is unsigned until the Store signs it.
      - name: Build the Microsoft Store package
        shell: pwsh
        run: ./app/msix/build.ps1 -NoBuild

      - uses: actions/upload-artifact@v4
        with:
          name: magma-mcsr-msix
          path: target/msix/magma-mcsr.msix
          if-no-files-found: error
