<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Update required</title>
  </head>
  <body>
    <div class="backdrop">
      <div class="card" role="alertdialog" aria-labelledby="title" aria-describedby="text">
        <h1 id="title">Update required</h1>
        <p id="text">
          This version of Magma MCSR is no longer supported. Update to keep syncing replays. Nothing waiting to upload
          will be lost.
        </p>
        <div class="actions">
          <button id="quit" class="secondary">Quit</button>
          <button id="update" class="primary" autofocus>Update now</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/notice.ts"></script>
  </body>
</html>
