[package]
name = "magma-app"
version = "0.2.1"
description = "Magma desktop companion"
license = "GPL-3.0-only"
edition.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "magma_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "gzip", "http2", "charset"] }
tokio = { version = "1", features = ["time", "sync"] }
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Reads the start of the game's older, gzipped logs (see game.rs).
flate2 = "1"
# Lists network connections for the "Network" setting.
if-addrs = "0.13"
tauri-plugin-single-instance = "2"
getrandom = "0.3"


[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
# Window placement (fullscreen without visible resizing) and the startup registry entry.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
