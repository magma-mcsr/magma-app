<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Magma MCSR</title>
  </head>
  <body>
    <div class="bar" id="bar">
      <div class="brand">
        <img src="/magma-logo.svg" alt="" class="logo" />
        <span>Magma MCSR</span>
      </div>
      <div class="tabs" role="tablist" aria-label="View">
        <!-- Replays first: it is what the app is for; the website is the second tab -->
        <button class="tab" id="tab-app" data-action="tab-app" role="tab" aria-selected="true">
          <span>Replays</span><span class="dot"></span>
        </button>
        <button class="tab" id="tab-site" data-action="tab-site" role="tab" aria-selected="false">Website</button>
      </div>
      <div class="nav">
        <button class="icon" data-action="back" aria-label="Back">
          <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <button class="icon" data-action="forward" aria-label="Forward">
          <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></svg>
        </button>
        <button class="icon" data-action="reload" aria-label="Reload">
          <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.55M13 2.5v3h-3" /></svg>
        </button>
      </div>
      <div class="section" id="section"></div>
      <div class="spacer"></div>
      <button class="download" id="download" data-action="show-download" hidden>
        <span class="dot"></span><span class="download-label" id="download-label">Downloading</span><span class="download-name" id="download-name"></span>
      </button>
      <button class="update" id="update" data-action="update" hidden>Update</button>
      <!-- App settings and About. A gear stands alone as "settings" everywhere -->
      <button class="icon settings" id="settings" data-action="settings" aria-label="Settings" title="Settings" aria-pressed="false">
        <!-- The usual gear (lucide "settings", same as the website) -->
        <svg viewBox="0 0 24 24">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <div class="window">
        <button class="win" data-action="minimize" aria-label="Minimize">
          <span class="box"><svg viewBox="0 0 16 16"><path d="M3.5 8h9" /></svg></span>
        </button>
        <button class="win" data-action="maximize" aria-label="Maximize" id="maximize">
          <span class="box">
            <svg viewBox="0 0 16 16" class="when-normal"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" /></svg>
            <svg viewBox="0 0 16 16" class="when-maximized">
              <rect x="3.5" y="5.5" width="7" height="7" rx="1.5" />
              <path d="M5.5 3.5h5a2 2 0 0 1 2 2v5" />
            </svg>
          </span>
        </button>
        <button class="win close" data-action="close" aria-label="Close">
          <span class="box"><svg viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7" /></svg></span>
        </button>
      </div>
    </div>
    <script type="module" src="/src/titlebar.ts"></script>
  </body>
</html>
